# rtklib rnx2rtkp config - drone RTK kinematic
pos1-posmode       =kinematic  # (2:kinematic)
pos1-frequency     =l1+2+3    # l1+l2+l5
pos1-soltype       =combined
pos1-elmask        =15
pos1-snrmask       =0
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =61         # gps+glo+gal+qzs+bds (1+4+8+16+32)
pos2-armode        =continuous
pos2-gloarmode     =on
pos2-arthres       =3
pos2-arlockcnt     =0
pos2-arelmask      =0
pos2-aroutcnt      =5
pos2-arminfix      =10
pos2-slipthres     =0.05
pos2-maxage        =30
pos2-rejionno      =30
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0
out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =on         # output velocity + velocity std
out-timesys        =gpst
out-timeform       =tow        # gps week + seconds-of-week
out-timendec       =6
out-degform        =deg
out-height         =ellipsoidal
out-geoid          =internal
out-solstatic      =all
stats-errratio     =100
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =2
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =1
stats-prnaccelv    =0.1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-clkstab      =5e-12
ant1-postype       =rinexhead  # rover (kinematic, ignored)
ant2-postype       =rinexhead  # base station position from RINEX header
misc-timeinterp    =on
