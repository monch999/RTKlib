# rtklib rnx2rtkp config - drone RTK kinematic
#
# 适用硬件: 流动站 Unicore UB4B0, 基站 中海达 iRTK10。异厂商组合, 下面几处排除
# 都是为它准备的; 换成同厂商基站要按注释里的实测重新复核一遍。
#
# 2026-09 用 0104 项目四个架次(20260903 / 0135 / 0621 / 0818)逐项消融定下来的。
# 每一项都是"从本配置只改这一项"的对照(固定率):
#
#   改动                        20260903   0135    0818    0621
#   -------------------------------------------------------------
#   (本配置)                      93.7%   100.0%   98.0%   94.5%
#   navsys 加回 QZSS              85.6%    99.2%   97.7%   94.6%
#   navsys 加回 GLONASS           94.0%   100.0%   98.6%   17.9%
#   清空 exclsats (放回 BDS-2)    23.3%    99.3%   98.3%   92.0%
#   arlockcnt 20 -> 0             50.9%    99.3%   98.8%   82.7%
#   arelmask 40 -> 20             90.4%    99.2%   97.4%   94.6%
#   errphase 0.006 -> 0.003       90.6%    89.5%   95.4%   90.6%
#   frequency l1+2 -> l1+2+3      93.6%   100.0%   98.0%   94.2%
#
# 三处排除(QZSS / GLONASS / BDS-2)都是同一种取舍: 加回去在三个架次上最多 +0.6 个
# 点, 在第四个架次上却是灾难性的。少掉的卫星是真实代价(GLONASS 值 4 颗左右),
# 但这一对接收机上它们带来的是未标定的系统偏差, 不是几何。
pos1-posmode       =kinematic  # (2:kinematic)
pos1-frequency     =l1+2       # l1+l2。l1+2+3 四个架次全部持平或略降, 且 ratio 更低
                               # (0135 从 932 掉到 277), L5 在本机上没带来增益
pos1-soltype       =combined
# 唯一属于"测站"而不属于"硬件"的一项: 它要挡的是基站天线周围反射回来的东西,
# 换个架设点就得重挑。rtkproc.exe 默认 --auto-elmask 会从这个值起按 30/35/40/45
# 打分自选; 直接用 rnx2rtkp 的话要自己试。
pos1-elmask        =25
pos1-snrmask       =0
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =41         # gps+gal+bds (1+8+32)
                               # 去 QZSS: 流动站把 QZSS 的 L2 标成 L2W, 而 RTKLIB 的
                               #   codepris[QZS][1]="LSX" 不含 'W', 读 RINEX 时优先级
                               #   为 0 被丢弃 -> J03/J07 只剩单频, 进 LAMBDA 只有害处
                               # 去 GLONASS: gloarmode 已经 off(见下), 但它仍参与浮点解;
                               #   0621 那种强多路径测站上会把浮点解也带坏(94.5%->17.9%)
# 排除 BDS-2 (C01~C16): 与中海达基站之间有未标定的系统性偏差, 性质同下面的 GLONASS
# IFB。实测只留 BDS-3 时单系统固定率 61%/ratio 544, 只留 BDS-2 时 15%/ratio 3.4。
# B1I/B3I 原始数据本身是干净的(单差 GF 历元间稳健 std 0.007~0.012 m, 与伽利略同级),
# 所以这是接收机间的偏差, 不是观测质量。换同厂商基站后可以试着放回来。
pos1-exclsats      =C01 C02 C03 C04 C05 C06 C07 C08 C09 C10 C11 C12 C13 C14 C15 C16
pos2-armode        =fix-and-hold
# 必须 off: 流动站 Unicore UB4B0 / 基站 中海达 iRTK10 属异厂商, GLONASS 频间偏差
# 未标定。置 on 会把整组模糊度带坏 —— 实测本机数据 =on 时 100% float、ratio≈1.0,
# =off 后固定率 52%, 再配 armode=fix-and-hold 达 63%。换成同厂商基站再考虑打开。
pos2-gloarmode     =off
pos2-arthres       =3
pos2-arlockcnt     =20         # 失锁/周跳后先锁 20 个历元再进模糊度集, 避免未收敛的
                               # 模糊度拖垮整组
pos2-arelmask      =40         # 只让 40 度以上的卫星参与"固定"; 低仰角星仍参与定位。
                               # 注意降权代替不了剔除: RTKLIB 2.4.3 的 LAMBDA 是整组
                               # 固定, 把 stats-errphaseel 从 0.006 加到 0.08 实测毫无
                               # 变化(0621 仍然 0%), 必须把它们踢出模糊度集。
pos2-aroutcnt      =5
pos2-arminfix      =10
pos2-slipthres     =0.05
pos2-maxage        =30
pos2-rejionno      =30
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0
out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =on         # output velocity + velocity std
out-timesys        =gpst
out-timeform       =tow        # gps week + seconds-of-week
out-timendec       =6
out-degform        =deg
out-height         =ellipsoidal
out-geoid          =internal
out-solstatic      =all
# 注意: RTKLIB 只认 stats-eratio1 / stats-eratio2, 没有 stats-errratio 这个键 ——
# 写成后者会被 loadopts() 静默忽略(见 src/options.c 的 sysopts[])。
stats-eratio1      =100
stats-eratio2      =100
stats-errphase     =0.006      # 单差 GF 检验给出本流动站相位噪声约 1 cm(无人机小天线),
stats-errphaseel   =0.006      # RTKLIB 缺省的 3 mm 过于乐观, 会让 LAMBDA 选错整数
stats-errphasebl   =0
stats-errdoppler   =2
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =1
stats-prnaccelv    =0.1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-clkstab      =5e-12
ant1-postype       =rinexhead  # rover (kinematic, ignored)
ant2-postype       =rinexhead  # base station position from RINEX header
misc-timeinterp    =on
